name: Release checks

# Required on deploy-dev and deploy-prod (status check name: release-checks). It runs on every pull
# request into them, with no path filter, so the required check always reports. A pull request that does
# not change package.json's version against the base branch is not a release: it passes with a
# "no release in this PR" line, and R4-R7 (version, changelog) are skipped by `edxr package check
# --base-version`; the other rules still run.
#
# The PR check: the same release rules (R1-R12, R14, R17) the publish runs, on the pull request's
# commit, against the channel its base branch publishes to. Replaces the GitHub OIDC call to
# package-deploy.educationxr.com/check-*. Reads the registry anonymously; no signing, no publish.

on:
  pull_request:
    branches:
      - deploy-dev
      - deploy-prod

permissions:
  contents: read

env:
  PACKAGE_NAME: com.caffeine
  # edxr-cli commit that has `edxr package check`. Bump it on purpose, together with publish.yml.
  EDXR_CLI_REF: f7476a4b79cdace182b62deb89c0a7cd0c60d55b

jobs:
  release-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Channel this pull request publishes to
        env:
          # the branch the pull request targets
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          case "$BASE" in
            deploy-dev) CHANNEL=unity-dev ;;
            deploy-prod) CHANNEL=unity ;;
            *) echo "::error::no release check for branch $BASE"; exit 1 ;;
          esac
          echo "CHANNEL=$CHANNEL" >> "$GITHUB_ENV"

      # the check lists tracked files and reads text; it needs no LFS content
      - name: Check out the pull request's commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version: '1.25'
          cache: false

      - name: Token for the private Go modules (GitHub App, read-only, 1 hour)
        id: modules-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.CI_MODULES_APP_ID }}
          private-key: ${{ secrets.CI_MODULES_APP_KEY }}
          owner: heizenrader
          repositories: rapid-api-core,edxr-cli

      - name: Install edxr
        env:
          GOPRIVATE: github.com/heizenrader/*
          GOWORK: 'off'
          # the token reaches git for this step only, through a credential helper (never in a URL or a config file)
          GH_MODULES_TOKEN: ${{ steps.modules-token.outputs.token }}
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: credential.https://github.com.helper
          GIT_CONFIG_VALUE_0: '!f() { echo username=x-access-token; echo "password=$GH_MODULES_TOKEN"; }; f'
        run: |
          if [ -z "$GH_MODULES_TOKEN" ]; then
            echo "::error::GH_MODULES_TOKEN is not available to this repository (private heizenrader/edxr-cli and its modules cannot be fetched)"
            exit 1
          fi
          git clone --quiet https://github.com/heizenrader/edxr-cli.git "$RUNNER_TEMP/edxr-cli"
          git -C "$RUNNER_TEMP/edxr-cli" checkout --quiet "$EDXR_CLI_REF"
          mkdir -p "$RUNNER_TEMP/bin"
          (cd "$RUNNER_TEMP/edxr-cli" && go build -o "$RUNNER_TEMP/bin/edxr" .)
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # The version package.json has on the base branch. If it cannot be read (no package.json there, no
      # version), BASE_VERSION stays empty and every rule runs: only a clear answer relaxes the check.
      - name: Read the base branch's version
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          base_version=""
          if gh api -H 'Accept: application/vnd.github.raw' "repos/$GITHUB_REPOSITORY/contents/package.json?ref=$BASE" > "$RUNNER_TEMP/base-package.json"; then
            base_version=$(jq -r '.version // empty | select(type == "string")' "$RUNNER_TEMP/base-package.json" || true)
          fi
          echo "base branch $BASE has version: ${base_version:-(unknown)}"
          echo "BASE_VERSION=$base_version" >> "$GITHUB_ENV"

      # prod is where both deploy branches publish to (deploy-dev goes to unity-dev on prod)
      - name: Release checks
        run: edxr package check . --env prod --channel "$CHANNEL" --name "$PACKAGE_NAME" ${BASE_VERSION:+--base-version "$BASE_VERSION"}
