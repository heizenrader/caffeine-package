name: Release checks

on:
  pull_request:
    branches:
      - deploy-dev
      - deploy-prod

permissions:
  id-token: write
  contents: read

jobs:
  release-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check the package at this commit
        env:
          # the branch the pull request targets
          TARGET: ${{ github.event.pull_request.base.ref }}
          REF: ${{ github.event.pull_request.head.sha }}
        run: |
          case "$TARGET" in
            deploy-dev) CHECK=check-dev ;;
            deploy-prod) CHECK=check-prod ;;
            *) echo "no release check for branch $TARGET"; exit 1 ;;
          esac
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=package-deploy.educationxr.com" | jq -r .value)
          if [ -z "$TOKEN" ] || [ "$TOKEN" = null ]; then
            echo "could not get a GitHub OIDC token"
            exit 1
          fi
          RESPONSE=$(curl -sS -H "Authorization: Bearer $TOKEN" -w '\n%{http_code}' "https://package-deploy.educationxr.com/$CHECK/com.caffeine?ref=$REF")
          STATUS=$(printf '%s\n' "$RESPONSE" | tail -n 1)
          printf '%s\n' "$RESPONSE" | sed '$d'
          if [ "$STATUS" != "200" ]; then
            echo "release check did not pass (HTTP $STATUS)"
            exit 1
          fi
