name: Release checks

# The PR check: the same release rules (R1-R12, R14, R17) the publish runs, on the pull request's
# commit, against the channel its base branch publishes to. Replaces the GitHub OIDC call to
# package-deploy.educationxr.com/check-*. Reads the registry anonymously; no signing, no publish.

on:
  pull_request:
    branches:
      - deploy-dev
      - deploy-prod

permissions:
  contents: read

env:
  PACKAGE_NAME: com.caffeine
  # edxr-cli commit that has `edxr package check`. Bump it on purpose, together with publish.yml.
  EDXR_CLI_REF: 4562cfe2a65395c9bfd2b7ae5c399e6dab0b8662

jobs:
  release-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Channel this pull request publishes to
        env:
          # the branch the pull request targets
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          case "$BASE" in
            deploy-dev) CHANNEL=unity-dev ;;
            deploy-prod) CHANNEL=unity ;;
            *) echo "::error::no release check for branch $BASE"; exit 1 ;;
          esac
          echo "CHANNEL=$CHANNEL" >> "$GITHUB_ENV"

      # the check lists tracked files and reads text; it needs no LFS content
      - name: Check out the pull request's commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - name: Install edxr
        env:
          GOPRIVATE: github.com/heizenrader/*
          GOWORK: 'off'
          # the token reaches git for this step only, as an in-memory url rewrite (never written to a config file)
          GH_MODULES_TOKEN: ${{ secrets.GH_MODULES_TOKEN }}
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: url.https://${{ secrets.GH_MODULES_TOKEN }}:x-oauth-basic@github.com/.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/
        run: |
          if [ -z "$GH_MODULES_TOKEN" ]; then
            echo "::error::GH_MODULES_TOKEN is not available to this repository (private heizenrader/edxr-cli and its modules cannot be fetched)"
            exit 1
          fi
          git clone --quiet https://github.com/heizenrader/edxr-cli.git "$RUNNER_TEMP/edxr-cli"
          git -C "$RUNNER_TEMP/edxr-cli" checkout --quiet "$EDXR_CLI_REF"
          mkdir -p "$RUNNER_TEMP/bin"
          (cd "$RUNNER_TEMP/edxr-cli" && go build -o "$RUNNER_TEMP/bin/edxr" .)
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # prod is where both deploy branches publish to (deploy-dev goes to unity-dev on prod)
      - name: Release checks
        run: edxr package check . --env prod --channel "$CHANNEL" --name "$PACKAGE_NAME"
